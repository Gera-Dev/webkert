<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Bejelentkezés</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="pl. pelda@email.hu">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Az email cím megadása kötelező
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Kérjük, adjon meg érvényes email címet
          </mat-error>
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Jelszó</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            A jelszó megadása kötelező
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            A jelszónak legalább 6 karakter hosszúnak kell lennie
          </mat-error>
        </mat-form-field>
        
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
            <mat-spinner *ngIf="isLoading" [diameter]="24" class="login-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Bejelentkezés</span>
          </button>
        </div>
      </form>
    </mat-card-content>
    
    <mat-card-actions class="card-actions">
      <p>Még nincs fiókja?</p>
      <button mat-button color="accent" (click)="navigateToRegister()">Regisztráció</button>
    </mat-card-actions>

    <!-- Teszt környezeti információ -->
    <mat-card-footer>
      <div class="test-info">
        <p>Teszt környezet - használja a következő adatokat:</p>
        <p><strong>Email:</strong> felhasznalo&#64;example.com</p>
        <p><strong>Jelszó:</strong> jelszo123</p>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
